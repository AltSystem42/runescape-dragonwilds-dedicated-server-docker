name: Build and Push Docker Image

on:
  push:
    branches:
      - main
    tags:
      - 'v*'   # triggers on version tags like v0.2.2

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Extract metadata (tags)
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: andyaltsys/dragonwilds-dedicated-server
          tags: |
            type=raw,value=latest
            type=ref,event=tag

      - name: Build and push
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}

      - name: Update Docker Hub description
        env:
          DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
          DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
        run: |
          set -euo pipefail
          # peter-evans/dockerhub-description is currently broken (open issue #331:
          # Docker Hub returns 403 Forbidden for everyone after they changed auth).
          # Use Docker Hub's documented access-token flow instead.
          access_token="$(curl -fsS -X POST https://hub.docker.com/v2/auth/token \
            -H 'Content-Type: application/json' \
            -d "{\"identifier\":\"${DOCKERHUB_USERNAME}\",\"secret\":\"${DOCKERHUB_TOKEN}\"}" \
            | jq -er '.access_token')"
          jq -n --rawfile desc dockerhub.md '{full_description: $desc}' > /tmp/dh-desc.json
          curl -fsS -X PATCH \
            -H "Authorization: Bearer ${access_token}" \
            -H 'Content-Type: application/json' \
            --data-binary @/tmp/dh-desc.json \
            "https://hub.docker.com/v2/repositories/${DOCKERHUB_USERNAME}/dragonwilds-dedicated-server" \
            >/dev/null
          echo "Docker Hub description updated"